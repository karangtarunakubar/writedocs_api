     1. Header Navbar: Controls for Theme, API Key configuration, preset options, and trigger execution.
     2. Workspace Drawer (Collapsible): Library history, search filters, and tag filters to quickly switch document contexts.

-->

import bcrypt from 'bcrypt';
import jwt from 'jsonwebtoken';
import { db } from '../config/database.js';

const router = express.Router();

/**
 * @route POST /api/v1/auth/login
 * @desc Authenticate user & issue JWT
 */
router.post('/login', async (req, res) => {
  const { email, password } = req.body;

  if (!email || !password) {
    return res.status(400).json({ error: 'Please provide email and password' });
  }

  try {
    const user = await db.user.findUnique({ where: { email } });
    if (!user) return res.status(401).json({ error: 'Invalid credentials' });

    const isMatch = await bcrypt.compare(password, user.passwordHash);
    if (!isMatch) return res.status(401).json({ error: 'Invalid credentials' });

    const token = jwt.sign(
      { userId: user.id, role: user.role },
      process.env.JWT_SECRET,
      { expiresIn: '24h' }
    );

    return res.status(200).json({ success: true, token, user });
  } catch (error) {
    return res.status(500).json({ error: 'Internal server error' });
  }
});

export default router;`

app = FastAPI(title="Data Processing API")

class DataPayload(BaseModel):

    records: list

@app.post("/process-dataset")

export function useAsyncData<T>(asyncFn: () => Promise<T>) {
  const [data, setData] = useState<T | null>(null);
  const [loading, setLoading] = useState<boolean>(true);
  const [error, setError] = useState<Error | null>(null);

  const execute = useCallback(async () => {
    setLoading(true);
    try {
      const res = await asyncFn();
      setData(res);
    } catch (err) {
      setError(err as Error);
    } finally {
      setLoading(false);
    }
  }, [asyncFn]);

  useEffect(() => { execute(); }, [execute]);

  return { data, loading, error, refetch: execute };
}`

    map: HashMap<K, V>,
    order: Vec<K>,
}

            ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-300'
            : 'bg-slate-900/40 border-slate-800 hover:bg-slate-800 text-slate-300'
        }" data-id="${item.id}">
          <div class="flex items-center justify-between">
            <span class="font-medium text-xs truncate max-w-[170px]">${item.title}</span>
            <span class="text-[9px] text-slate-500 font-mono">${item.date}</span>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.doc-item').forEach(el => {
        el.addEventListener('click', () => {
          state.activeDocId = el.dataset.id;
          renderHistory();
          loadActiveDocument();
        });
      });
    }

    // Load Document Data into View
    function loadActiveDocument() {
      const active = state.history.find(d => d.id === state.activeDocId);
      if (!active) return;

      docTitleInput.value = active.title;
      formattedDocOutput.textContent = active.docContent;
      rawMarkdownOutput.value = active.docContent;

      // Render Line Breakdown
      explainLinesList.innerHTML = (active.explainedLines || []).map(item => `
        <div class="p-3 rounded-lg border border-slate-800 bg-slate-900/60 space-y-1">
          <code class="text-xs font-mono text-emerald-300 block">${item.line}</code>
          <p class="text-xs text-slate-400">${item.explanation}</p>
        </div>
      `).join('');

      // Update Chart Scores
      if (active.qualityReport && state.radarChart) {
        document.getElementById('overallScoreText').textContent = `${active.qualityReport.overallScore}/100`;
        state.radarChart.data.datasets[0].data = [
          active.qualityReport.clarity,
          active.qualityReport.completeness,
          active.qualityReport.examples,
          active.qualityReport.coverage
        ];
        state.radarChart.update();

        // Update recommendations list
        document.getElementById('recommendationsList').innerHTML = (active.qualityReport.suggestions || []).map(s => `
          <li class="flex items-center gap-2">
            <span class="text-amber-400 font-bold">&#9888;</span>
            <span>${s}</span>
          </li>
        `).join('');
      }
    }

    // Event Listener Handlers
    function setupEventListeners() {
      // Sidebar Toggle
      toggleSidebarBtn.addEventListener('click', () => {
        sidebar.classList.toggle('hidden');
      });

      // New Workspace
      document.getElementById('newWorkspaceBtn').addEventListener('click', () => {
        codeInput.value = '';
        docTitleInput.value = 'Untitled Code Document';
        formattedDocOutput.textContent = 'Click "Generate Docs" to convert code to documentation.';
      });

      // Tab Switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.remove('bg-slate-800', 'text-emerald-400');
            b.classList.add('text-slate-400');
          });
          btn.classList.add('bg-slate-800', 'text-emerald-400');
          btn.classList.remove('text-slate-400');

          const tabName = btn.dataset.tab;
          state.activeTab = tabName;

          document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.add('hidden'));
          if (tabName === 'docs') document.getElementById('tabContentDocs').classList.remove('hidden');
          if (tabName === 'diagram') document.getElementById('tabContentDiagram').classList.remove('hidden');
          if (tabName === 'explain') document.getElementById('tabContentExplain').classList.remove('hidden');
          if (tabName === 'quality') document.getElementById('tabContentQuality').classList.remove('hidden');
          if (tabName === 'raw') document.getElementById('tabContentRaw').classList.remove('hidden');
        });
      });

      // Tag Filtering
      document.querySelectorAll('.tag-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('.tag-pill').forEach(p => {
            p.classList.remove('bg-emerald-500', 'text-slate-950', 'font-bold');
            p.classList.add('bg-slate-800', 'text-slate-400');
          });
          pill.classList.add('bg-emerald-500', 'text-slate-950', 'font-bold');
          pill.classList.remove('bg-slate-800', 'text-slate-400');

          state.selectedTag = pill.dataset.tag;
          renderHistory();
        });
      });

      // Generate Documentation Trigger
      generateDocsBtn.addEventListener('click', () => {
        const codeText = codeInput.value.trim();
        if (!codeText) {
          alert('Please input or upload source code first.');
          return;
        }

        // Show Loader
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.add('hidden'));
        loader.classList.remove('hidden');

        setTimeout(() => {
          loader.classList.add('hidden');
          document.getElementById('tabContentDocs').classList.remove('hidden');

          const generatedContent = `# ${docTitleInput.value}
*Generated via WriteDocs AST Pipeline*

## Overview
Automated software documentation generated for source snippet. The implementation follows target modular principles and defensive design patterns.

### Operational Features
- Standard payload validation & sanitization.
- Asynchronous pipeline execution.
- Graceful error boundary interception.

---

## Interactive Code Breakdown
\`\`\`javascript
${codeText}
\`\`\`

---

## Exception Handling Matrix
| Risk Scenario | Mitigation Strategy |
| :--- | :--- |
| Null Input Payload | Pre-validation boundary check throws Bad Request |
| Connection Delay | Async task cancellation protection |`;

          const newDoc = {
            id: `doc-${Date.now()}`,
            title: docTitleInput.value || 'Generated Document',
            date: new Date().toLocaleDateString(),
            tags: ['#API', '#Generated'],
            docContent: generatedContent,
            explainedLines: [
              { line: codeText.split('\n')[0] || 'Entry point', explanation: 'Imports dependencies and initializes module scope.' },
              { line: codeText.split('\n')[Math.floor(codeText.split('\n').length / 2)] || 'Main handler', explanation: 'Core computational transformation function.' }
            ],
            qualityReport: {
              clarity: 92,
              completeness: 88,
              examples: 94,
              coverage: 90,
              overallScore: 91,
              suggestions: [
                'Consider adding performance benchmark metrics.',
                'Include end-to-end integration test commands.'
              ]
            }
          };

          state.history.unshift(newDoc);
          state.activeDocId = newDoc.id;
          renderHistory();
          loadActiveDocument();
        }, 1200);
      });

      // Copy & Download
      document.getElementById('copyDocBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(rawMarkdownOutput.value);
        alert('Documentation copied to clipboard!');
      });

      document.getElementById('downloadDocBtn').addEventListener('click', () => {
        const blob = new Blob([rawMarkdownOutput.value], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${docTitleInput.value.toLowerCase().replace(/\s+/g, '-')}-docs.md`;
        a.click();
      });
    }

    // --- CHART.JS QUALITY RADAR CHART ---
    function initQualityChart() {
      const ctx = document.getElementById('qualityRadarChart').getContext('2d');
      state.radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['Clarity', 'Completeness', 'Examples', 'Test Coverage'],
          datasets: [{
            label: 'Doc Quality Index',
            data: [95, 90, 88, 94],
            backgroundColor: 'rgba(16, 185, 129, 0.25)',
            borderColor: '#10b981',
            borderWidth: 2,
            pointBackgroundColor: '#38bdf8'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              angleLines: { color: 'rgba(51, 65, 85, 0.4)' },
              grid: { color: 'rgba(51, 65, 85, 0.4)' },
              pointLabels: { color: '#94a3b8', font: { size: 11 } },
              ticks: { display: false, backdropColor: 'transparent' },
              min: 0,
              max: 100
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    // --- HTML5 CANVAS ARCHITECTURE DIAGRAM RENDERER (NO SVG / NO MERMAID) ---
    function drawFlowDiagram() {
      const canvas = document.getElementById('flowCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      // Draw Grid Background
      ctx.strokeStyle = 'rgba(51, 65, 85, 0.2)';
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 20) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += 20) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // Nodes definition
      const nodes = [
        { label: 'HTTP Request', x: w/2 - 70, y: 30, color: '#38bdf8' },
        { label: 'Payload Validator', x: w/2 - 70, y: 100, color: '#10b981' },
        { label: 'Bcrypt Hash Match', x: w/2 - 70, y: 170, color: '#f59e0b' },
        { label: 'Generate & Sign JWT', x: w/2 - 70, y: 240, color: '#34d399' }
      ];

      // Draw Arrows
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      for (let i = 0; i < nodes.length - 1; i++) {
        const startY = nodes[i].y + 35;
        const endY = nodes[i+1].y;
        ctx.beginPath();
        ctx.moveTo(w/2, startY);
        ctx.lineTo(w/2, endY);
        ctx.stroke();

        // Arrow head
        ctx.beginPath();
        ctx.moveTo(w/2 - 4, endY - 6);
        ctx.lineTo(w/2 + 4, endY - 6);
        ctx.lineTo(w/2, endY);
        ctx.fillStyle = '#64748b';
        ctx.fill();
      }

      // Draw Box Nodes
      nodes.forEach(n => {
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = n.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(n.x, n.y, 140, 35, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(n.label, w/2, n.y + 22);
      });
    }
  </script>
</body>
</html>
